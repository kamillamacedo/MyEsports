<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEsports</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img class="header__logo" src="./assets/LogoSample_ByTailorBrands (3).jpg">
        <nav class="header__menu">
            <input class="header__menu__searchbar" type="text" placeholder="Search...">
            <a class="header__menu__link" href="index.html">Home</a>
            <a class="header__menu__login">Log in</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="hero-text">
                <h1 class="hero-text__title"><strong>Your</strong> esports. <strong>Your</strong> matches.</h1>
                <h2 class="hero-text__subtitle">Select your favorite games, championships, teams, and players to follow matches in real time.</h2>
            </div>
        </section>
        <section class="home-card__container">
            <div class="home-card">
                <h3 class="home-card__options">Sport</h3>
                <input class="home-card__inputs" type="text" placeholder="Which game would you like to follow?">
                <h3 class="home-card__options">Championship</h3>
                <input class="home-card__inputs" type="text" placeholder="Select a championship (optional)">
                <h3 class="home-card__options">Team</h3>
                <input class="home-card__inputs" type="text" placeholder="Select a team (optional)">
                <h3 class="home-card__options">Player</h3>
                <input class="home-card__inputs" type="text" placeholder="Select a player (optional)">
                <a class="home-card__viewbutton" href="results.html" target="_blank">
                    <img class="home-card__viewbutton__eyeicon" src="./assets/view-icon.png">
                    View matches
                </a>  
            </div>
        </section>
        <section class="hero-spacer"></section>
    </main>
    <footer>
        <img class="footer__logo" src="./assets/Untitled.png">
        <div class="footer__links">
            <a class="footer__links__link">About</a>
            <a class="footer__links__link">Contact</a>
        </div>
    </footer>
</body>
</html>
