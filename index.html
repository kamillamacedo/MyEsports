<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEsports</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header></header>
    <main class="home">
        <section class="hero">
            <div class="hero-container">
                <div class="hero-text">
                    <h1 class="hero-text__title"><strong>Your</strong> esports. <strong>Your</strong> matches.</h1>
                    <h2 class="hero-text__subtitle">Select your favorite games, championships, teams, and players to follow matches in real time.</h2>
                </div>

                <div class="home-card">
                    <h3 class="home-card__options">Sport</h3>
                    <!-- mais para frente esses paragrafos devem virar inputs -->
                    <p class="home-card__inputs">Which game would you like to follow?</p>
                    <h3 class="home-card__options">Championship</h3>
                    <p class="home-card__inputs">Select a championship (optional)</p>
                    <h3 class="home-card__options">Team</h3>
                    <p class="home-card__inputs">Select a team (optional)</p>
                    <h3 class="home-card__options">Player</h3>
                    <p class="home-card__inputs">Select a player (optional)</p>
                    <a class="home-card__viewbutton" href="resultados.html" target="_blank">
                        <img src="./design/assets/view-icon.png">
                        View matches
                    </a>  
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
